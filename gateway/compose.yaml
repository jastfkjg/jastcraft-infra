name: jastcraft-gateway
services:
  caddy:
    image: ${CADDY_IMAGE:?Set CADDY_IMAGE to an immutable image digest}
    restart: unless-stopped
    environment:
      ECHOOO_ADDRESS: ${ECHOOO_ADDRESS:?Set echooo domain}
      SHADOWTABLE_DOMAIN: ${SHADOWTABLE_DOMAIN:?Set ShadowTable domain}
      ACME_EMAIL: ${ACME_EMAIL:?Set certificate contact email}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - /opt/gateway/config:/etc/caddy:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [echooo, shadowtable]
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
networks:
  echooo:
    external: true
    name: echooo_proxy
  shadowtable:
    external: true
    name: shadowtable_proxy
volumes:
  caddy_data:
    external: true
    name: ${CADDY_DATA_VOLUME:?Set existing Caddy data volume name}
  caddy_config:
    external: true
    name: ${CADDY_CONFIG_VOLUME:?Set existing Caddy config volume name}
