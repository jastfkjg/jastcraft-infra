name: Verify infrastructure
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/verify.sh
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        stack: [aws/prod/shared-01, aliyun/prod/shadowtable-01, aliyun/staging/shadowtable-01]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.14.9'
      - run: terraform fmt -check -recursive terraform
      - name: Validate isolated stack without cloud credentials or state access
        env:
          STACK: ${{ matrix.stack }}
        run: |
          terraform -chdir="terraform/stacks/$STACK" init -backend=false -input=false -lockfile=readonly
          terraform -chdir="terraform/stacks/$STACK" validate
          terraform -chdir="terraform/stacks/$STACK" test
